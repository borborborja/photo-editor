name: Photo Editor Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FOSS release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run FOSS editor and LUT tests
        run: >-
          ./gradlew --no-daemon
          :app:testDefaultDebugUnitTest
          --tests 'com.hinnka.mycamera.fossin.*'
          --tests 'com.hinnka.mycamera.model.CameraExperienceTest'
          --tests 'com.hinnka.mycamera.ui.camera.PixelCameraChromeTest'
          --tests 'com.hinnka.mycamera.ui.camera.ZoomStopAnimationTest'
          --tests 'com.hinnka.mycamera.lut.*ParserValidationTest'

      - name: Build unsigned F-Droid APK
        run: ./gradlew --no-daemon :app:assembleDefaultRelease

      - name: Build installable preview APK
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          PREVIEW_KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/photo-editor-preview.jks"
          ./gradlew --no-daemon :app:assembleDefaultPreview \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/photo-editor-preview.jks" \
            -PRELEASE_STORE_PASSWORD="$PREVIEW_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$PREVIEW_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$PREVIEW_KEY_PASSWORD"

      - name: Verify APK identity and permissions
        env:
          APK: app/build/outputs/apk/default/release/app-default-release-unsigned.apk
          PREVIEW_APK: app/build/outputs/apk/default/preview/app-default-preview.apk
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -s "$PREVIEW_APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='org.foss.photoeditor'"
          "$AAPT" dump badging "$PREVIEW_APK" | grep -F "package: name='org.foss.photoeditor'"
          "$APKSIGNER" verify --verbose "$PREVIEW_APK"
          ! "$AAPT" dump permissions "$APK" | grep -E \
            'android.permission.(ACCESS_NETWORK_STATE|READ_PHONE_STATE)'
          ! unzip -l "$APK" | grep -E \
            'billingclient|play/services|firebase|bugly|crashlytics|com/google/android/gms|com/google/android/play'
          ! "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -E \
            'com\.google\.android\.(apps\.photos|libraries\.photos)'
          ! "$AAPT" dump xmltree "$PREVIEW_APK" AndroidManifest.xml | grep -E \
            'com\.google\.android\.(apps\.photos|libraries\.photos)'

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-editor-foss-${{ github.sha }}
          path: |
            app/build/outputs/apk/default/release/app-default-release-unsigned.apk
            app/build/outputs/apk/default/preview/app-default-preview.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: photo-editor-foss-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/app-default-release-unsigned.apk
            dist/preview/app-default-preview.apk
